[project]
name = "ai-lecture-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyanshu Raj", email = "priyanshu.rajchauhan136315@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "streamlit-autorefresh>=1.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ai-lecture-learning = "ai_lecture_learning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
